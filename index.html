<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AtölyeKart | Ürün Kataloğu</title>
<style>
  :root {
    --bg: #faf6f1;
    --card-bg: #ffffff;
    --text-main: #3a3129;
    --text-muted: #7d7267;
    --accent: #b5652f;
    --accent-dark: #8f4d22;
    --border: #e9e0d4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: var(--bg);
    color: var(--text-main);
    line-height: 1.6;
    padding-bottom: 60px;
  }

  /* NavBar */
  .navbar {
    position: sticky;
    top: 0;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }

  .navbar-inner {
    max-width: 1080px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .nav-brand {
    font-weight: 700;
    color: var(--accent-dark);
    font-size: 1.2rem;
    letter-spacing: 0.03em;
  }

  .nav-links {
    display: flex;
    gap: 6px;
    list-style: none;
  }

  .nav-link {
    background: none;
    border: none;
    font-family: inherit;
    font-size: 0.9rem;
    color: var(--text-muted);
    padding: 8px 14px;
    border-radius: 3px;
    cursor: pointer;
  }

  .nav-link:hover {
    color: var(--accent-dark);
  }

  .nav-link.active {
    color: #fff;
    background: var(--accent);
  }

  .cart-count {
    display: inline-block;
    margin-left: 6px;
    background: var(--accent-dark);
    color: #fff;
    font-size: 0.7rem;
    border-radius: 10px;
    padding: 1px 7px;
  }

  .nav-link.active .cart-count {
    background: #fff;
    color: var(--accent-dark);
  }

  /* Hero / Anasayfa */
  .hero {
    text-align: center;
    padding: 56px 20px 40px;
    max-width: 680px;
    margin: 0 auto;
  }

  .hero .brand {
    font-size: 2.4rem;
    letter-spacing: 0.04em;
    color: var(--accent-dark);
    font-weight: 700;
  }

  .hero .tagline {
    margin-top: 10px;
    color: var(--text-muted);
    font-size: 1.05rem;
    font-style: italic;
  }

  .hero .divider {
    width: 60px;
    height: 2px;
    background: var(--accent);
    margin: 24px auto 0;
  }

  .cta-button {
    margin-top: 32px;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 14px 32px;
    font-size: 1rem;
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.03em;
    transition: background 0.2s ease;
  }

  .cta-button:hover {
    background: var(--accent-dark);
  }

  /* Ürünler sayfası */
  .page-title {
    max-width: 1080px;
    margin: 40px auto 0;
    padding: 0 20px;
    font-size: 1.6rem;
    color: var(--text-main);
  }

  .category-tabs {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    max-width: 1080px;
    margin: 20px auto 0;
    padding: 0 20px;
  }

  .category-tab {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 8px 18px;
    border-radius: 20px;
    font-family: inherit;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .category-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  main {
    max-width: 1080px;
    margin: 0 auto;
  }

  .catalog {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 32px;
    margin-top: 32px;
    padding: 0 20px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 28px rgba(58, 49, 41, 0.12);
  }

  .card-image {
    height: 220px;
    overflow: hidden;
    position: relative;
  }

  .card-image.sold-out img {
    filter: grayscale(0.7);
    opacity: 0.75;
  }

  .stock-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    background: var(--text-main);
    color: #fff;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 3px;
  }

  .card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .card-body {
    padding: 22px 24px 26px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  .category-label {
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 8px;
  }

  .card-title {
    font-size: 1.3rem;
    margin-bottom: 10px;
    color: var(--text-main);
  }

  .card-desc {
    color: var(--text-muted);
    font-size: 0.95rem;
    flex: 1;
    margin-bottom: 18px;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }

  .price {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--accent-dark);
  }

  .price .unit {
    font-size: 0.78rem;
    font-weight: 400;
    color: var(--text-muted);
  }

  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 18px;
    font-size: 0.85rem;
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.03em;
    transition: background 0.2s ease;
  }

  .btn:hover {
    background: var(--accent-dark);
  }

  .btn:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .btn-secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
  }

  .btn-secondary:hover {
    background: var(--accent);
    color: #fff;
  }

  .card-action {
    width: 100%;
    margin-top: 14px;
  }

  .note {
    display: inline-block;
    margin-top: 14px;
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  /* Sepet & Profil */
  .cart-page, .profile-page {
    max-width: 680px;
    margin: 0 auto;
    padding: 40px 20px;
  }

  /* Gizlilik Politikası */
  .policy-page h2 {
    margin: 28px 0 8px;
    font-size: 1.05rem;
    color: var(--accent-dark);
  }

  .policy-page p, .policy-page li {
    margin-bottom: 8px;
  }

  .policy-page ul {
    padding-left: 20px;
  }

  .policy-updated {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-bottom: 16px;
  }

  .policy-disclaimer {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .link-inline {
    color: var(--accent);
  }

  .link-inline:hover {
    color: var(--accent-dark);
  }

  .footer-links {
    margin-bottom: 10px;
  }

  .cart-item {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 14px;
    margin-bottom: 14px;
  }

  .cart-item img {
    width: 64px;
    height: 64px;
    object-fit: cover;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .cart-item-info {
    flex: 1;
  }

  .cart-item-info h3 {
    font-size: 1.05rem;
    margin-bottom: 4px;
  }

  .cart-item-info .cat {
    font-size: 0.75rem;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .qty-control {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .qty-control button {
    width: 28px;
    height: 28px;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 3px;
    cursor: pointer;
    font-size: 1rem;
    font-family: inherit;
  }

  .cart-item-remove {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 0.78rem;
    text-decoration: underline;
    cursor: pointer;
    margin-left: 12px;
    font-family: inherit;
  }

  .cart-summary {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--accent-dark);
  }

  .empty-cart {
    text-align: center;
    color: var(--text-muted);
    padding: 60px 0;
  }

  .profile-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 28px;
  }

  .profile-row {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.95rem;
  }

  .profile-row:last-child {
    border-bottom: none;
  }

  .profile-row .label {
    color: var(--text-muted);
  }

  .profile-orders-empty {
    margin-top: 20px;
    color: var(--text-muted);
    font-size: 0.9rem;
    text-align: center;
  }

  /* Social + footer */
  .social-links {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-bottom: 18px;
  }

  .social-links a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--accent-dark);
    transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
  }

  .social-links a:hover {
    background: var(--accent);
    color: #fff;
    transform: translateY(-2px);
  }

  .social-links svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }

  footer {
    text-align: center;
    margin-top: 64px;
    padding-top: 28px;
    border-top: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 0.85rem;
  }

  /* QR panel */
  .qr-panel {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    box-shadow: 0 8px 24px rgba(58, 49, 41, 0.15);
    z-index: 20;
  }

  .qr-panel-title {
    display: block;
    text-align: center;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .qr-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .qr-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-size: 0.68rem;
    color: var(--text-muted);
  }

  .qr-item svg {
    border-radius: 4px;
  }

  @media (max-width: 520px) {
    .qr-panel { padding: 10px; bottom: 12px; right: 12px; }
    .qr-panel-title { display: none; }
    .qr-grid { gap: 8px; }
    .qr-item svg { width: 48px; height: 48px; }
  }

  /* Sipariş / Stok bildirimi pencereleri */

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(58, 49, 41, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }

  .modal-panel {
    background: var(--card-bg);
    border-radius: 8px;
    max-width: 420px;
    width: 100%;
    padding: 28px;
    box-shadow: 0 20px 48px rgba(58, 49, 41, 0.25);
    position: relative;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
  }

  .modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    background: none;
    border: none;
    font-size: 1.3rem;
    color: var(--text-muted);
    cursor: pointer;
    line-height: 1;
    font-family: inherit;
  }

  .modal-close:hover {
    color: var(--accent-dark);
  }

  .modal-title {
    font-size: 1.3rem;
    color: var(--text-main);
    margin-bottom: 8px;
    padding-right: 20px;
  }

  .modal-desc {
    font-size: 0.9rem;
    color: var(--text-muted);
    margin-bottom: 20px;
  }

  .form-field {
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-field label {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .form-field input {
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--text-main);
  }

  .form-field input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .consent-field {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 16px;
    line-height: 1.4;
  }

  .consent-field input {
    margin-top: 2px;
    accent-color: var(--accent);
  }

  .form-error {
    color: #a23b2a;
    font-size: 0.85rem;
    margin-bottom: 12px;
  }

  .load-error {
    max-width: 560px;
    margin: 80px auto;
    padding: 0 20px;
    text-align: center;
    color: var(--text-muted);
  }

  .modal-success {
    text-align: center;
    color: var(--text-main);
    padding: 10px 0 4px;
  }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="src/vendor/qrcode-react.umd.js"></script>
<script src="https://unpkg.com/@babel/standalone@8.0.4/babel.min.js" integrity="sha384-bdF7m0Y1IFKt9Q6xC8X9qkXn0OBriQWKyWwZKYsN05zF6P/g9OakjjL0G2Sd4pB4" crossorigin="anonymous"></script>

<script type="text/babel" data-type="module">
  const { useState, useEffect } = React;
  const { QRCodeSVG } = QRCodeReact;

  // Ürün verisi tek kaynaktan gelir: src/data/products.json (web, mobil ve n8n aynı dosyayı kullanır).
  let PRODUCTS = [];
  let CATEGORIES = [];

  const MOCK_USER = {
    name: 'Ayşe Yılmaz',
    email: 'ayse.yilmaz@example.com',
    address: 'Caferağa Mah. Moda Cad. No:14, Kadıköy / İstanbul',
    orders: [],
  };

  // Formlar n8n'e doğrudan değil, kendi API route'larımız üzerinden gider (api/order.js, api/stock-notify.js).
  // Webhook adresi ve secret yalnızca sunucuda (Vercel env) durur.
  async function postForm(path, payload) {
    let res;
    try {
      res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...payload, source: 'web' }),
      });
    } catch (err) {
      throw new Error('Sunucuya ulaşılamadı. Lütfen bağlantınızı kontrol edip tekrar deneyin.');
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const firstFieldError = data.errors ? Object.values(data.errors)[0] : null;
      throw new Error(firstFieldError || data.error || 'Bir hata oluştu, lütfen tekrar deneyin.');
    }
    return data;
  }

  function parseHash() {
    const parts = window.location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    if (parts[0] === 'urunler') {
      const category = CATEGORIES.some((c) => c.id === parts[1]) ? parts[1] : 'tumu';
      return { page: 'urunler', category };
    }
    if (parts[0] === 'profil' || parts[0] === 'sepet' || parts[0] === 'gizlilik') {
      return { page: parts[0], category: 'tumu' };
    }
    return { page: 'anasayfa', category: 'tumu' };
  }

  function buildHash(page, category) {
    if (page === 'urunler') {
      return category && category !== 'tumu' ? `#/urunler/${category}` : '#/urunler';
    }
    if (page === 'anasayfa') return '#/';
    return `#/${page}`;
  }

  function getBaseUrl() {
    return window.location.origin + window.location.pathname;
  }

  function QRPanel() {
    const baseUrl = getBaseUrl();
    const qrCodes = [
      { label: 'Anasayfa', value: baseUrl },
      ...CATEGORIES.filter((c) => c.id !== 'tumu').map((cat) => ({
        label: cat.label,
        value: `${baseUrl}${buildHash('urunler', cat.id)}`,
      })),
    ];

    return (
      <div className="qr-panel">
        <span className="qr-panel-title">Telefonunla Tara</span>
        <div className="qr-grid">
          {qrCodes.map((qr) => (
            <div className="qr-item" key={qr.label}>
              <QRCodeSVG value={qr.value} size={64} bgColor="#ffffff" fgColor="#3a3129" />
              <span>{qr.label}</span>
            </div>
          ))}
        </div>
      </div>
    );
  }

  function Modal({ onClose, children }) {
    useEffect(() => {
      document.body.style.overflow = 'hidden';
      function onKeyDown(e) {
        if (e.key === 'Escape') onClose();
      }
      window.addEventListener('keydown', onKeyDown);
      return () => {
        document.body.style.overflow = '';
        window.removeEventListener('keydown', onKeyDown);
      };
    }, []);

    return (
      <div className="modal-overlay" onClick={onClose}>
        <div className="modal-panel" onClick={(e) => e.stopPropagation()}>
          <button className="modal-close" onClick={onClose} aria-label="Kapat">×</button>
          {children}
        </div>
      </div>
    );
  }

  function ConsentCheckbox({ id, checked, onChange }) {
    return (
      <label className="consent-field" htmlFor={id}>
        <input id={id} type="checkbox" required checked={checked} onChange={(e) => onChange(e.target.checked)} />
        <span>
          Kişisel verilerimin{' '}
          <a className="link-inline" href="#/gizlilik" target="_blank" rel="noopener noreferrer">
            Gizlilik Politikası
          </a>{' '}
          kapsamında işlenmesine açık rıza veriyorum.
        </span>
      </label>
    );
  }

  // Sipariş ve stok bildirimi formlarının ortak gönderim mantığı: yükleniyor durumu, sunucu hatası, başarı ekranı.
  function useFormSubmit(path) {
    const [submitted, setSubmitted] = useState(false);
    const [isSubmitting, setIsSubmitting] = useState(false);
    const [error, setError] = useState('');

    async function submit(payload) {
      setIsSubmitting(true);
      setError('');
      try {
        await postForm(path, payload);
        setSubmitted(true);
      } catch (err) {
        setError(err.message);
      } finally {
        setIsSubmitting(false);
      }
    }

    return { submitted, isSubmitting, error, submit };
  }

  function SuccessView({ title, message, onClose }) {
    return (
      <React.Fragment>
        <h2 className="modal-title">{title}</h2>
        <p className="modal-success">{message}</p>
        <button className="btn" style={{ width: '100%', marginTop: 12 }} onClick={onClose}>
          Kapat
        </button>
      </React.Fragment>
    );
  }

  function OrderModal({ product, onClose }) {
    const [name, setName] = useState('');
    const [phone, setPhone] = useState('');
    const [email, setEmail] = useState('');
    const [quantity, setQuantity] = useState(1);
    const [consent, setConsent] = useState(false);
    const { submitted, isSubmitting, error, submit } = useFormSubmit('/api/order');

    function handleSubmit(e) {
      e.preventDefault();
      submit({ name, phone, email, quantity: Number(quantity), productId: product.id, consent });
    }

    return (
      <Modal onClose={onClose}>
        {submitted ? (
          <SuccessView
            title="Siparişiniz alındı"
            message={`${product.title} için siparişiniz bize ulaştı. Hazırlık süresini e-posta ile bildireceğiz.`}
            onClose={onClose}
          />
        ) : (
          <React.Fragment>
            <h2 className="modal-title">Sipariş Ver</h2>
            <p className="modal-desc">
              <strong>{product.title}</strong> · ₺{product.price} / {product.unit}
            </p>
            <form onSubmit={handleSubmit}>
              <div className="form-field">
                <label htmlFor="order-name">Ad Soyad</label>
                <input id="order-name" type="text" required maxLength={80} value={name} onChange={(e) => setName(e.target.value)} />

          <SuccessView

  function Sepet({ cart, onUpdateQty, onRemove }) {
    if (cart.length === 0) {
      return (

          <p className="empty-cart">Sepetiniz boş.</p>

    const total = cart.reduce((sum, item) => {
      const product = PRODUCTS.find((p) => p.id === item.productId);
      return sum + product.price * item.qty;
    }, 0);

    return (
      <div className="cart-page">
        <h1 className="page-title" style={{ margin: '0 0 24px', padding: 0 }}>Sepet</h1>
        {cart.map((item) => {
          const product = PRODUCTS.find((p) => p.id === item.productId);
          return (
            <CartItemRow
              key={item.productId}
              item={item}
              product={product}
              onUpdateQty={onUpdateQty}
              onRemove={onRemove}
            />
          );
        })}
        <div className="cart-summary">
          <span>Toplam</span>
          <span>₺{total}</span>
        </div>
      </div>
    );

  function App() {
    const initialRoute = parseHash();
    const [page, setPage] = useState(initialRoute.page);
    const [activeCategory, setActiveCategory] = useState(initialRoute.category);
    const [cart, setCart] = useState([]);
    // { type: 'order' | 'stock', product } — açık olan form modalı
    const [activeForm, setActiveForm] = useState(null);

    useEffect(() => {
      function onHashChange() {
        const route = parseHash();
        setPage(route.page);
        setActiveCategory(route.category);
      }
      window.addEventListener('hashchange', onHashChange);
      return () => window.removeEventListener('hashchange', onHashChange);
    }, []);

    function navigate(newPage) {
      setPage(newPage);
      window.location.hash = buildHash(newPage, newPage === 'urunler' ? activeCategory : 'tumu');
    }

    function selectCategory(catId) {
      setActiveCategory(catId);
      window.location.hash = buildHash('urunler', catId);
    }

    const cartCount = cart.reduce((sum, item) => sum + item.qty, 0);

    function addToCart(productId) {
      setCart((prev) => {
        const existing = prev.find((item) => item.productId === productId);
        if (existing) {
          return prev.map((item) =>
            item.productId === productId ? { ...item, qty: item.qty + 1 } : item
          );
        }
        return [...prev, { productId, qty: 1 }];
      });
    }

    function updateQty(productId, delta) {
      setCart((prev) =>
        prev
          .map((item) =>
            item.productId === productId ? { ...item, qty: item.qty + delta } : item
          )
          .filter((item) => item.qty > 0)
      );
    }

    function removeFromCart(productId) {
      setCart((prev) => prev.filter((item) => item.productId !== productId));
    }

    let content;
    if (page === 'anasayfa') {
      content = <Anasayfa onNavigate={navigate} />;
    } else if (page === 'urunler') {
      content = (
        <Urunler
          activeCategory={activeCategory}
          onSelectCategory={selectCategory}
          onAddToCart={addToCart}
          onOrder={(product) => setActiveForm({ type: 'order', product })}
          onStockNotify={(product) => setActiveForm({ type: 'stock', product })}
        />
      );
    } else if (page === 'profil') {
      content = <Profil />;
    } else if (page === 'gizlilik') {
      content = <GizlilikPolitikasi />;
    } else {
      content = <Sepet cart={cart} onUpdateQty={updateQty} onRemove={removeFromCart} />;
    }

    return (
      <div>
        <NavBar
          page={page}
          cartCount={cartCount}
          onNavigate={navigate}
        />
        {content}
        <Footer />
        {activeForm?.type === 'order' && (
          <OrderModal product={activeForm.product} onClose={() => setActiveForm(null)} />
        )}
        {activeForm?.type === 'stock' && (
          <StockNotifyModal product={activeForm.product} onClose={() => setActiveForm(null)} />
        )}
      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  fetch('src/data/products.json')
    .then((res) => res.json())
    .then((data) => {
      PRODUCTS = data.products;
      CATEGORIES = data.categories;
      root.render(<App />);
    })
    .catch(() => {
      root.render(
        <p className="load-error">
          Ürün verisi yüklenemedi. Siteyi bir sunucu üzerinden açın (ör. <code>npm run dev</code>).
        </p>
      );
    });
</script>
